<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19">
        <animate attributeName="stop-color" values="#0b0f19; #151d30; #0b0f19" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827; #0a1120; #111827" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="296" x="2" y="2" rx="14" fill="none" stroke="url(#cyanGlow)" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Wafer Circuit Lines (Animated Dynamic Glow) -->
  <g opacity="0.25">
    <path d="M100 150 L300 150 L350 200 L500 200" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 5">
      <animate attributeName="stroke-dashoffset" from="150" to="0" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M1100 150 L900 150 L850 100 L700 100" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="10 5">
      <animate attributeName="stroke-dashoffset" from="0" to="150" dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Central Wafer Silicon Graphic -->
  <g transform="translate(600, 150)">
    <!-- Rotating Silicon Grid Outer Ring -->
    <circle r="120" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="6 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="95" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- Pulse Central Wafer Node -->
    <circle r="70" fill="#0f172a" stroke="url(#cyanGlow)" stroke-width="3" filter="url(#glow)">
      <animate attributeName="r" values="68;72;68" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Main Banner Title & Subtitle -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="130" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="1.5" filter="url(#glow)">
      Awesome Wafer Fab Scheduling
    </text>
    <text x="600" y="175" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="3">
      SEMICONDUCTOR FAB APS • DISPATCHING • WIP OPTIMIZATION
    </text>
    
    <!-- Dynamic Pill Badge -->
    <g transform="translate(600, 220)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="-110" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="10" y="5" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="1">
        CURATED ECOSYSTEM 2026
      </text>
    </g>
  </g>
</svg>
